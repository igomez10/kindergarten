# Tests, builds ghcr.io/<owner>/kindergarten (one image: /api, /controller,
# /migrate, dashboard), and pins its digest in helm/kindergarten/values.homelab.yaml,
# which Argo CD's kindergarten-app deploys. Same loop as socialapp's image workflow
# in igomez10/microservices.
name: kindergarten image

on:
  push:
    branches: [main]
    paths:
      - "**"
      # Deployment config is not image input; helm/** is also where the
      # promote job commits, so excluding it is what stops a build loop.
      - "!helm/**"
      - "!terraform/**"
      - "!deploy/**"
      - "!docs/**"
      - "!**.md"
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kindergarten

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          KINDERGARTEN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npx tsc --noEmit
        working-directory: apps/web

  build:
    needs: test
    # Only main builds and promotes: a manual run on another branch would
    # otherwise pin that branch's image into main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 for the homelab nodes; arm64 for Apple Silicon laptops.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          # Links the GHCR package to this repo. A new package is still
          # private: make it public once (package settings) so the cluster
          # can pull without credentials.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: kindergarten-promote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pin new digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          VALUES=helm/kindergarten/values.homelab.yaml
          sed -i -E "s|(ghcr.io/[^/]+/kindergarten)@sha256:[a-f0-9]+|\1@${DIGEST}|" "$VALUES"
          if git diff --quiet; then
            echo "already pinned"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES"
          git commit -m "deploy(kindergarten): ${GITHUB_SHA:0:12}" -m "Built from ${GITHUB_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main

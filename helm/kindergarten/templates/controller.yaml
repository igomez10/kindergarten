# The reconciler. One replica; leases with fencing tokens make more safe, but
# one is enough here. Crash-safe by construction: everything it knows is in
# the metadata database and the Kubernetes API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kindergarten-controller
  namespace: {{ .Values.namespace }}
  labels: {{- include "kindergarten.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kindergarten-controller
  template:
    metadata:
      labels:
        {{- include "kindergarten.labels" . | nindent 8 }}
        app.kubernetes.io/name: kindergarten-controller
    spec:
      serviceAccountName: kindergarten-controller
      enableServiceLinks: false
      {{- include "kindergarten.podSecurity" . | nindent 6 }}
      containers:
        - name: controller
          image: {{ required "image is required" .Values.image }}
          command: ["/controller"]
          env:
            {{- include "kindergarten.databaseURL" . | nindent 12 }}
            - name: CONN_CHECK
              value: direct
            - name: STORAGE_CLASS
              value: {{ .Values.storageClass }}
            - name: WORKERS
              value: {{ .Values.controller.workers | quote }}
            - name: CONTROLLER_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: PLATFORM_NAMESPACE
              value: {{ .Values.namespace }}
            - name: TENANT_SECRET_READERS
              value: kindergarten-api,kindergarten-controller
            {{- if .Values.dbDomain }}
            - name: DB_DOMAIN
              value: {{ .Values.dbDomain }}
            - name: ADDRESS_POOL
              value: {{ .Values.addressPool }}
            - name: CLOUDFLARE_API_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.cloudflareSecret }}, key: api_token}}
            - name: CLOUDFLARE_ZONE
              valueFrom: {secretKeyRef: {name: {{ .Values.cloudflareSecret }}, key: zone}}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources: {{- toYaml .Values.resources.controller | nindent 12 }}
          {{- include "kindergarten.containerSecurity" . | nindent 10 }}

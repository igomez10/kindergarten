# API + dashboard behind oauth2-proxy:
#
#   Istio gateway ──> Service :80 ──> oauth2-proxy :4180 ──> 127.0.0.1:8080 /api
#
# /api listens on the pod's loopback (AUTH_MODE=proxy refuses anything else),
# so oauth2-proxy is the only way in and the identity headers it sets cannot
# be forged. ZITADEL refuses the login for anyone without the kindergarten-user
# role (terraform/zitadel.tf).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kindergarten-api
  namespace: {{ .Values.namespace }}
  labels: {{- include "kindergarten.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kindergarten-api
  template:
    metadata:
      labels:
        {{- include "kindergarten.labels" . | nindent 8 }}
        app.kubernetes.io/name: kindergarten-api
    spec:
      serviceAccountName: kindergarten-api
      enableServiceLinks: false
      {{- include "kindergarten.podSecurity" . | nindent 6 }}
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2Proxy.image }}
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ required "oidcIssuer is required" .Values.oidcIssuer }}
            - --redirect-url=https://{{ required "host is required" .Values.host }}/oauth2/callback
            - --upstream=http://127.0.0.1:8080/
            - --http-address=0.0.0.0:4180
            - --scope=openid profile email
            - --code-challenge-method=S256
            # Who may sign in is ZITADEL's project role check, not email domain.
            - --email-domain=*
            - --skip-provider-button=true
            - --cookie-name=_kindergarten_session
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=12h
            - --reverse-proxy=true
            # X-Forwarded-User (the ZITADEL sub) and -Email on every upstream
            # request. Client-sent copies are stripped first: that is the
            # default --skip-auth-strip-headers=true, and it must stay on.
            # Turned off, oauth2-proxy appends its value after the client's
            # and the API would read the forged one.
            - --pass-user-headers=true
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.oidcSecret }}, key: client_id}}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.oidcSecret }}, key: client_secret}}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.oidcSecret }}, key: cookie_secret}}
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.resources.proxy | nindent 12 }}
          {{- include "kindergarten.containerSecurity" . | nindent 10 }}
        - name: api
          image: {{ required "image is required" .Values.image }}
          command: ["/api"]
          env:
            {{- include "kindergarten.databaseURL" . | nindent 12 }}
            - name: LISTEN_ADDR
              value: 127.0.0.1:8080
            - name: HEALTH_ADDR
              value: 0.0.0.0:8081
            - name: AUTH_MODE
              value: proxy
            - name: OIDC_ISSUER
              value: {{ .Values.oidcIssuer }}
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
          {{- include "kindergarten.containerSecurity" . | nindent 10 }}
---
# Points at oauth2-proxy, never at the API directly.
apiVersion: v1
kind: Service
metadata:
  name: kindergarten
  namespace: {{ .Values.namespace }}
  labels: {{- include "kindergarten.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kindergarten-api
  ports:
    - name: http
      port: 80
      targetPort: http

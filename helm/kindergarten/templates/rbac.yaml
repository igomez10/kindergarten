# Least privilege, cluster-wide only where tenancy requires it.
#
# Neither component can read Secrets cluster-wide. The controller binds
# kindergarten-tenant-secrets-reader to both ServiceAccounts inside each tenant
# namespace it bootstraps (internal/tenant), and holds `bind` on that one role
# and no other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kindergarten-api
  namespace: {{ .Values.namespace }}
  labels: {{- include "kindergarten.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kindergarten-controller
  namespace: {{ .Values.namespace }}
  labels: {{- include "kindergarten.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kindergarten-tenant-secrets-reader
  labels: {{- include "kindergarten.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kindergarten-controller
  labels: {{- include "kindergarten.labels" . | nindent 4 }}
rules:
  # Tenant bootstrap (server-side apply: get + create + patch).
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "limitranges"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["kindergarten-tenant-secrets-reader"]
  # Databases.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Observation and deletion checks.
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kindergarten-controller
  labels: {{- include "kindergarten.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kindergarten-controller
subjects:
  - kind: ServiceAccount
    name: kindergarten-controller
    namespace: {{ .Values.namespace }}

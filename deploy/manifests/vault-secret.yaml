# Credentials from Vault (kv/kindergarten/*), synced by the Vault Secrets Operator.
# Policy and kubernetes auth role: terraform/vault.tf.
#
#   kv/kindergarten/oidc        client_id, client_secret, cookie_secret  → oauth2-proxy
#   kv/kindergarten/cloudflare  api_token, zone                          → controller (DNS records)
#
# Neither is Terraform-managed: a vault_kv_secret_v2 would put the values into
# Terraform state in cleartext. See terraform/README.md for the commands.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: kindergarten
  namespace: platform-system
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: kindergarten
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kindergarten-oidc
  namespace: platform-system
spec:
  vaultAuthRef: kindergarten
  mount: kv
  type: kv-v2
  path: kindergarten/oidc
  refreshAfter: 1h
  destination:
    name: kindergarten-oidc
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: kindergarten-api
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kindergarten-cloudflare
  namespace: platform-system
spec:
  vaultAuthRef: kindergarten
  mount: kv
  type: kv-v2
  path: kindergarten/cloudflare
  refreshAfter: 1h
  destination:
    name: kindergarten-cloudflare
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: kindergarten-controller

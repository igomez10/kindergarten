# Credentials from Vault (kv/pgcloud/*), synced by the Vault Secrets Operator.
# Policy and kubernetes auth role: terraform/vault.tf.
#
#   kv/pgcloud/oidc        client_id, client_secret, cookie_secret  → oauth2-proxy
#   kv/pgcloud/cloudflare  api_token, zone                          → controller (DNS records)
#
# Neither is Terraform-managed: a vault_kv_secret_v2 would put the values into
# Terraform state in cleartext. See terraform/README.md for the commands.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: pgcloud
  namespace: platform-system
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: pgcloud
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgcloud-oidc
  namespace: platform-system
spec:
  vaultAuthRef: pgcloud
  mount: kv
  type: kv-v2
  path: pgcloud/oidc
  refreshAfter: 1h
  destination:
    name: pgcloud-oidc
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: pgcloud-api
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgcloud-cloudflare
  namespace: platform-system
spec:
  vaultAuthRef: pgcloud
  mount: kv
  type: kv-v2
  path: pgcloud/cloudflare
  refreshAfter: 1h
  destination:
    name: pgcloud-cloudflare
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: pgcloud-controller

# What the kindergarten-data Argo CD Application syncs (manually): the platform
# namespace, its metadata database, Vault-synced secrets, network policy, and
# the MetalLB pool managed databases take their addresses from.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - metadata-db.yaml
  - network.yaml
  - vault-secret.yaml
  - metallb-pool.yaml
